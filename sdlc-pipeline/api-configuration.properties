# ============================================
# GitHub Integration (Primary)
# ============================================
git.enabled=true
git.provider=github
git.platform=github
git.base.url=https://github.com
git.api.url=https://api.github.com

# GitHub Credentials & Repository
# NOTE: git.personal.access.token should NOT be stored in source code!
# Use environment variable: export GIT_PERSONAL_ACCESS_TOKEN=your_token_here
# Or GitHub Actions secret: ${{ secrets.GIT_PERSONAL_ACCESS_TOKEN }}
git.personal.access.token=${GIT_PERSONAL_ACCESS_TOKEN}
git.repo.url=https://github.com/Sampada1619991/AutomationDummy.git
git.repo.group=Sampada1619991
git.repo.name=AutomationDummy
git.repo.project.id=98894311

# Git User Configuration (for commits)
git.user.name=SDLC Pipeline Bot
git.user.email=sampada_chendake@epam.com

# Branch Configuration
git.branch.main=main
git.branch.develop=develop
git.branch.feature.prefix=feature/EDJOBSA-22-
git.pull.request.branch.prefix=pr/EDJOBSA-22-

# PR Configuration
git.pr.enabled=true
git.pr.auto.create=true
git.pr.title.template=[AUTO] EDJOBSA-22: Self-Service Book Borrowing - Phase 8 Submission
git.pr.description.include.artifacts=true
git.pr.description.include.tests=true
git.pr.description.include.qa.sign.off=true
git.pr.labels=feature,automated,sdlc-pipeline,edjobsa-22
git.pr.assignee.default=sampada_chendake
git.pr.reviewers=sampada_chendake
git.pr.merge.strategy=squash
git.pr.delete.branch.after.merge=true

# Code Deployment Path
code.output.directory=sdlc-pipeline/src/main/java/com/library/borrowing
code.test.directory=sdlc-pipeline/src/test/java/com/library/borrowing
code.db.migration.directory=sdlc-pipeline/src/main/resources/db/migration
code.overwrite.existing=true

# Git Workflow
git.workflow.clone.depth=1
git.workflow.commit.sign=false
git.workflow.push.retries=3
git.workflow.push.retry.delay.ms=2000

# ============================================
# Code Generation & Deduplication (Phase 5)
# ============================================
phase5.deduplication.enabled=true
phase5.deduplication.strategy=merge
phase5.merge.on.class.name.match=true
phase5.merge.on.method.name.match=true
phase5.merge.test.cases=true
phase5.skip.identical.migrations=true
phase5.generate.merge.log=true
phase5.merge.conflict.resolution=manual-review
phase5.backup.existing.files=true
phase5.backup.directory=./code-backup/{timestamp}

# Logging
logging.level=INFO
logging.file=./logs/pipeline.log


